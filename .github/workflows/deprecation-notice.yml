name: Deprecation notice on new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    # Skip the boilerplate for issues opened by repo members/owners.
    if: ${{ !contains(fromJSON('["OWNER", "MEMBER"]'), github.event.issue.author_association) }}
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const label = 'deprecated';

            const body = [
              '👋 Thanks for opening an issue.',
              '',
              '> [!WARNING]',
              '> **`mixpanel-iphone` is deprecated.** Mixpanel recommends migrating to the',
              '> [mixpanel-swift](https://github.com/mixpanel/mixpanel-swift) SDK. Its API is Swift-only;',
              '> Objective-C apps can adopt it through a small `@objc` Swift wrapper of their own.',
              '',
              'This repository is **not maintained on a regular schedule**. Apart from critical issues',
              '(security vulnerabilities or crashes that block shipping), reported issues may not receive',
              'a timely response or a fix.',
              '',
              'If this is a show-stopper for your production app, please open a ticket with',
              '[Mixpanel Support](https://help.mixpanel.com/hc/en-us/requests/new) so it is routed to the',
              'right team.',
              '',
              '_This is an automated message._',
            ].join('\n');

            await github.rest.issues.createComment({ owner, repo, issue_number, body });

            // Ensure the label exists, then apply it.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'e4e669',
                description: 'Filed against the deprecated mixpanel-iphone SDK',
              });
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
